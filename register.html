<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký - HomeFit AI</title>
  <!-- Bootstrap 5 (CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS riêng của trang này -->
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-hf">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold me-4" href="index.html">HomeFit AI</a>
      <button class="navbar-toggler my-2" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Mở menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="seeker-login.html">Đăng nhập</a></li>
        </ul>
        <ul class="navbar-nav align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="help.html">Trợ giúp</a></li>
          <li class="nav-item ms-lg-2 py-2 py-lg-0"><a href="profile.html" class="avatar" aria-label="Hồ sơ cá nhân"></a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card auth-card p-3 p-md-4">
          <h1 class="h3 mb-4">Tạo tài khoản</h1>
          <div class="mb-3"><label for="name" class="form-label fw-bold">Họ tên</label><input type="text" id="name" class="form-control"></div>
          <div class="mb-3"><label for="email" class="form-label fw-bold">Email</label><input type="email" id="email" class="form-control"></div>
          <div class="mb-3"><label for="pw" class="form-label fw-bold">Mật khẩu</label><input type="password" id="pw" class="form-control"></div>
          <button class="btn btn-primary w-100 fw-bold">Đăng ký</button>
          <p class="text-center small text-secondary mt-3 mb-0">Đã có tài khoản? <a href="seeker-login.html" class="fw-bold">Đăng nhập</a></p>
        </div>
      </div>
    </div>
  </main>
  <!-- Bootstrap 5 (JS) - chỉ để nút menu hoạt động trên điện thoại -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
