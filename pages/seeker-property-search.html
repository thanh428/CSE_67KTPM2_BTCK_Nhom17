<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tìm nhà - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/seeker-property-search.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="seeker-property-search.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="index.html">Trang chủ</a>
      <a class="me-3 fw-bold border-bottom border-warning border-3" href="seeker-property-search.html">Tìm nhà</a>
      <a class="me-3" href="seeker-property-compare.html">So sánh</a>
      <a class="me-3" href="seeker-home-brief.html">Brief của tôi</a>
      <a class="me-3" href="seeker-my-space.html">Của tôi</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><a class="dropdown-item" href="seeker-my-space.html">Của tôi</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container-fluid p-4">
      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="card p-3">
            <h5>Bộ lọc nhu cầu sống</h5>
            <label class="mt-2">Ngân sách tối đa (triệu/tháng)</label>
            <input id="loc-gia" type="number" class="form-control" value="14" />
            <label class="mt-2">Diện tích tối thiểu (m²)</label>
            <input id="loc-dientich" type="number" class="form-control" value="30" />
            <div class="form-check mt-3">
              <input id="loc-yentinh" class="form-check-input" type="checkbox" />
              <label class="form-check-label" for="loc-yentinh">Không gian yên tĩnh</label>
            </div>
            <div class="form-check">
              <input id="loc-lamviec" class="form-check-input" type="checkbox" />
              <label class="form-check-label" for="loc-lamviec">Có chỗ làm việc tại nhà</label>
            </div>
            <button id="nut-apdung" class="btn btn-xanh mt-3">Áp dụng</button>
            <button id="nut-xoaloc" class="btn btn-outline-secondary mt-2">Xóa bộ lọc</button>
          </div>
        </aside>
        <main class="col-lg-9">
          <input id="o-tim" class="form-control mb-3" placeholder="Tìm theo tên hoặc khu vực..." />
          <div id="thong-bao" class="thong-bao"></div>
          <div id="state-loading" class="d-none">Đang tải danh sách nhà...</div>
          <div id="state-empty" class="d-none alert alert-warning">
            Không có nhà phù hợp. Thử nới ngân sách hoặc bỏ bớt tiêu chí.
          </div>
          <div id="state-error" class="d-none alert alert-danger">
            <span id="error-text"></span>
            <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
          </div>
          <div id="list" class="row g-3 d-none"></div>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/seeker-property-search.js"></script>
  </body>
</html>
