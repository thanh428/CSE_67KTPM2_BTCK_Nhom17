<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tổng quan - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/agent-dashboard.css">
</head>
<body>
    <nav class="navbar bg-white border-bottom px-4">
        <a class="logo me-4" href="agent-dashboard.html">HomeFit <span>AI</span></a>
        <a class="me-3" href="agent-dashboard.html">Tổng quan</a>
        <a class="me-3" href="agent-listing-management.html">Listing</a>
        <a class="me-3" href="agent-listing-upload.html">Đăng tin</a>
        <a class="me-3" href="agent-viewing-schedule.html">Lịch hẹn</a>
        <a class="me-3" href="agent-lead-management.html">Lead</a>
        <span class="ms-auto me-3" id="ten-user"></span>
        <button id="nut-dangxuat" class="btn btn-outline-dark btn-sm">Đăng xuất</button>
    </nav>
    <div class="container py-4">
        <h2>Tổng quan</h2>
        <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
        <div id="state-empty" class="d-none alert alert-warning"></div>
        <div id="state-error" class="d-none alert alert-danger">
            <span id="error-text"></span>
            <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
        </div>
        <div id="list" class="d-none">
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="kpi">
                        <b id="kpi-hd">0</b>
                        <span>Tin đang hoạt động</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="kpi">
                        <b id="kpi-cd">0</b>
                        <span>Chờ duyệt</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="kpi">
                        <b id="kpi-lead">0</b>
                        <span>Lead mới</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="kpi">
                        <b id="kpi-lich">0</b>
                        <span>Lịch xem sắp tới</span>
                    </div>
                </div>
            </div>
            <h5>Thao tác nhanh</h5>
            <a class="btn btn-xanh me-2" href="agent-listing-management.html">Quản lý listing</a>
            <a class="btn btn-outline-dark" href="agent-lead-management.html">Quản lý lead</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/agent-dashboard.js"></script>
</body>
</html>
