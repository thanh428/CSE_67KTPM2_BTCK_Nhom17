<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý lead - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/agent-lead-management.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="agent-dashboard.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="agent-dashboard.html">Tổng quan</a>
      <a class="me-3" href="agent-listing-management.html">Listing</a>
      <a class="me-3" href="agent-listing-upload.html">Đăng tin</a>
      <a class="me-3" href="agent-viewing-schedule.html">Lịch hẹn</a>
      <a class="me-3" href="agent-lead-management.html">Lead</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <h2>Quản lý lead</h2>
      <p>Khách quan tâm nhà của bạn</p>
      <div class="card p-3 mb-3">
        <b>Thêm lead</b>
        <div class="row g-2 mt-1">
          <div class="col-md-3"><input id="l-ten" class="form-control" placeholder="Tên khách" /></div>
          <div class="col-md-3"><input id="l-sdt" class="form-control" placeholder="SĐT 10 số" /></div>
          <div class="col-md-4"><input id="l-nhucau" class="form-control" placeholder="Nhu cầu" /></div>
          <div class="col-md-2"><button id="nut-them" class="btn btn-xanh w-100">Thêm lead</button></div>
        </div>
        <div class="loi" id="loi-lead"></div>
      </div>
      <select id="loc-tt" class="form-select w-auto mb-3">
        <option value="">Tất cả</option>
        <option>Mới</option>
        <option>Đang liên hệ</option>
        <option>Đã chốt</option>
        <option>Không phù hợp</option>
      </select>
      <div id="thong-bao"></div>
      <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
      <div id="state-empty" class="d-none alert alert-warning"></div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="d-none table-responsive">
        <table class="table bg-white">
          <thead>
            <tr>
              <th>Khách hàng</th>
              <th>Nhu cầu</th>
              <th>Nguồn</th>
              <th>Trạng thái</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bang"></tbody>
        </table>
      </div>
    </div>
    <div class="modal fade" id="modal-lead" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="m-ten">Lead</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="m-nhucau"></p>
            <label class="fw-bold">Đổi trạng thái</label>
            <select id="m-tt" class="form-select">
              <option>Mới</option>
              <option>Đang liên hệ</option>
              <option>Đã chốt</option>
              <option>Không phù hợp</option>
            </select>
            <label class="fw-bold mt-2">Ghi chú</label>
            <textarea id="m-ghichu" class="form-control"></textarea>
          </div>
          <div class="modal-footer">
            <button id="nut-luu-lead" class="btn btn-xanh">Lưu thay đổi</button>
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/agent-lead-management.js"></script>
  </body>
</html>
