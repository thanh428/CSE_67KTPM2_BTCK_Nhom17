<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chất lượng dữ liệu - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/moderator-data-quality.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="moderator-listing-review.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="moderator-listing-review.html">Duyệt listing</a>
      <a class="me-3" href="moderator-report-center.html">Report</a>
      <a class="me-3" href="moderator-data-quality.html">Chất lượng DL</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <h2>Chất lượng dữ liệu</h2>
      <p>Tin thiếu ảnh, giá bất thường hoặc nghi trùng</p>
      <div class="row g-3 mb-3">
        <div class="col-4">
          <div class="kpi">
            <b id="kpi-anh">0</b>
            <span>Listing thiếu ảnh</span>
          </div>
        </div>
        <div class="col-4">
          <div class="kpi">
            <b id="kpi-gia">0</b>
            <span>Giá bất thường</span>
          </div>
        </div>
        <div class="col-4">
          <div class="kpi">
            <b id="kpi-trung">0</b>
            <span>Nghi trùng lặp</span>
          </div>
        </div>
      </div>
      <input id="o-tim" class="form-control mb-3 d-inline-block w-50" placeholder="Tìm listing / vấn đề..." />
      <button id="nut-chay" class="btn btn-xanh ms-2">Chạy kiểm tra</button>
      <div id="thong-bao"></div>
      <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
      <div id="state-empty" class="d-none alert alert-warning"></div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="d-none table-responsive">
        <table class="table bg-white">
          <thead>
            <tr>
              <th>Listing</th>
              <th>Vấn đề</th>
              <th>Mức độ</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="bang"></tbody>
        </table>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/moderator-data-quality.js"></script>
  </body>
</html>
