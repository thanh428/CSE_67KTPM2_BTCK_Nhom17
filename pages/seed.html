<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhập dữ liệu mẫu - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/seed.css">
</head>
<body>
    <div class="container py-4" style="max-width:720px">
        <h2>Nhập dữ liệu mẫu lên MockAPI</h2>
        <p>Trang này đọc file <code>db.json</code> và đẩy dữ liệu lên MockAPI. <b>Chỉ bấm một lần</b>. Chạy lại sẽ bị nhân đôi dữ liệu (gói miễn phí chỉ cho khoảng 100 bản ghi mỗi resource). Muốn làm lại thì vào MockAPI bấm Reset all rồi chạy lại.</p>
        <p>Địa chỉ đang dùng: <code id="dia-chi"></code></p>
        <button id="nut-chay" class="btn btn-xanh">Bắt đầu nhập dữ liệu</button>
        <pre id="nhat-ky" class="mt-3"></pre>
    </div>
    <script src="../js/api-config.js"></script>
    <script src="../js/seed.js"></script>
</body>
</html>
