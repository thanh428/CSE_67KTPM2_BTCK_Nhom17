<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home Brief - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/seeker-home-brief.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="seeker-property-search.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="index.html">Trang chủ</a>
      <a class="me-3" href="seeker-property-search.html">Tìm nhà</a>
      <a class="me-3" href="seeker-property-compare.html">So sánh</a>
      <a class="me-3 fw-bold border-bottom border-warning border-3" href="seeker-home-brief.html">Brief của tôi</a>
      <a class="me-3" href="seeker-my-space.html">Của tôi</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><a class="dropdown-item" href="seeker-my-space.html">Của tôi</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <div class="row g-4">
        <div class="col-lg-7">
          <form id="form-brief" class="card p-3">
            <h4>Tạo Home Brief</h4>
            <label class="fw-bold mt-2" for="khuvuc">Khu vực mong muốn</label>
            <input id="khuvuc" class="form-control" value="Cầu Giấy" />
            <div class="loi" id="loi-khuvuc"></div>
            <label class="fw-bold mt-2" for="ngansach">Ngân sách tối đa (triệu/tháng)</label>
            <input id="ngansach" type="number" class="form-control" value="14" />
            <div class="loi" id="loi-ngansach"></div>
            <label class="fw-bold mt-2" for="phongngu">Số phòng ngủ</label>
            <input id="phongngu" type="number" class="form-control" value="2" />
            <label class="fw-bold mt-2" for="mota">Mô tả nhu cầu sống (tối thiểu 15 ký tự)</label>
            <textarea id="mota" class="form-control" rows="3">
            </textarea>
            <div class="loi" id="loi-mota"></div>
            <div class="form-check mt-2">
              <input id="chiase" type="checkbox" class="form-check-input" />
              <label class="form-check-label" for="chiase">Chia sẻ brief này với môi giới</label>
            </div>
            <button class="btn btn-xanh mt-3">Tạo brief và chạy AI</button>
          </form>
        </div>
        <div class="col-lg-5">
          <div class="ai-khung" id="ai-khung">
            <b>AI Lifestyle Matcher</b>
            <div id="ai-noidung">Điền brief rồi bấm nút để AI chấm điểm.</div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/seeker-home-brief.js"></script>
  </body>
</html>
