<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
    <nav class="navbar bg-white border-bottom px-4">
        <a class="logo" href="login.html">HomeFit <span>AI</span></a>
    </nav>
    <div class="khung">
        <h2>Lấy lại quyền truy cập</h2>
        <div id="buoc1" class="card p-3 mb-3">
            <b>Bước 1 · Nhập email</b>
            <label class="mt-2" for="email">Email đã đăng ký</label>
            <input id="email" class="form-control">
            <div class="loi" id="loi-email"></div>
            <button id="nut-gui" class="btn btn-xanh mt-2">Gửi liên kết khôi phục</button>
            <div id="tb-buoc1" class="mt-2"></div>
            <a href="login.html" class="mt-2">Quay lại đăng nhập</a>
        </div>
        <div id="buoc2" class="card p-3 d-none">
            <b>Bước 2 · Đặt mật khẩu mới</b>
            <label class="mt-2" for="mk1">Mật khẩu mới</label>
            <input id="mk1" type="password" class="form-control" placeholder="Tối thiểu 6 ký tự">
            <div class="loi" id="loi-mk1"></div>
            <label for="mk2">Nhập lại mật khẩu mới</label>
            <input id="mk2" type="password" class="form-control">
            <div class="loi" id="loi-mk2"></div>
            <button id="nut-luu" class="btn btn-warning mt-2">Lưu mật khẩu mới</button>
            <div id="tb-buoc2" class="mt-2"></div>
        </div>
    </div>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/forgot-password.js"></script>
</body>
</html>
