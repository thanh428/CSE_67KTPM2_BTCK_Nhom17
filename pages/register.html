<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <nav class="navbar bg-white border-bottom px-4">
        <a class="logo" href="login.html">HomeFit <span>AI</span></a>
    </nav>
    <div class="khung">
        <form id="form-dk" class="card p-4">
            <h2>Tạo tài khoản</h2>
            <label class="mt-2 fw-bold" for="ten">Họ tên</label>
            <input id="ten" class="form-control" placeholder="Nguyễn Văn A">
            <div class="loi" id="loi-ten"></div>

            <label class="mt-2 fw-bold" for="email">Email</label>
            <input id="email" class="form-control" placeholder="nhapemail@example.com">
            <div class="loi" id="loi-email"></div>

            <label class="mt-2 fw-bold" for="mk">Mật khẩu</label>
            <input id="mk" type="password" class="form-control" placeholder="Tối thiểu 6 ký tự">
            <div class="loi" id="loi-mk"></div>

            <label class="mt-2 fw-bold" for="mk2">Nhập lại mật khẩu</label>
            <input id="mk2" type="password" class="form-control">
            <div class="loi" id="loi-mk2"></div>

            <label class="mt-2 fw-bold" for="vaitro">Bạn là</label>
            <select id="vaitro" class="form-select">
                <option value="seeker">Người tìm nhà</option>
                <option value="agent">Môi giới</option>
            </select>

            <button class="btn btn-xanh mt-3" id="nut-dk">Đăng ký</button>

            <div id="thong-bao" class="mt-3"></div>

            <p class="mt-3 text-center">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        </form>
    </div>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
