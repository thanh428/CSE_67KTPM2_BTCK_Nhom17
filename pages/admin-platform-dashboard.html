<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tổng quan nền tảng - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/admin-platform-dashboard.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="admin-platform-dashboard.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="admin-category-management.html">Danh mục</a>
      <a class="me-3" href="admin-user-management.html">Người dùng</a>
      <a class="me-3" href="admin-platform-dashboard.html">Dashboard</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <h2>Tổng quan nền tảng</h2>
      <p>Tình hình nền tảng theo thời gian</p>
      <div class="btn-group mb-3">
        <button class="btn btn-outline-dark nut-loc active" data-ngay="7">7 ngày</button>
        <button class="btn btn-outline-dark nut-loc" data-ngay="30">30 ngày</button>
        <button class="btn btn-outline-dark nut-loc" data-ngay="180">6 tháng</button>
      </div>
      <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
      <div id="state-empty" class="d-none alert alert-warning"></div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="d-none">
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <div class="kpi">
              <b id="kpi-hd">0</b>
              <span>Listing hoạt động</span>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="kpi">
              <b id="kpi-cd">0</b>
              <span>Chờ duyệt</span>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="kpi">
              <b id="kpi-tk">0</b>
              <span>Tài khoản</span>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="kpi">
              <b id="kpi-bc">0</b>
              <span>Báo cáo mở</span>
            </div>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-7">
            <div class="card p-3">
              <b>Listing mới theo tháng</b>
              <svg id="bieu-do" viewBox="0 0 400 160" width="100%"></svg>
            </div>
          </div>
          <div class="col-md-5">
            <div class="card p-3">
              <b>AI: chấp nhận · từ chối · lỗi</b>
              <div id="the-ai" class="mt-2"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/admin-platform-dashboard.js"></script>
  </body>
</html>
