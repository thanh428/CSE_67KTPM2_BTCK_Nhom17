<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch xem nhà - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/agent-viewing-schedule.css">
</head>
<body>
    <nav class="navbar bg-white border-bottom px-4">
        <a class="logo me-4" href="agent-dashboard.html">HomeFit <span>AI</span></a>
        <a class="me-3" href="agent-dashboard.html">Tổng quan</a>
        <a class="me-3" href="agent-listing-management.html">Listing</a>
        <a class="me-3" href="agent-listing-upload.html">Đăng tin</a>
        <a class="me-3" href="agent-lead-management.html">Lead</a>
        <a class="me-3" href="agent-viewing-schedule.html">Lịch hẹn</a>
        <span class="ms-auto me-3" id="ten-user"></span>
        <button id="nut-dangxuat" class="btn btn-outline-dark btn-sm">Đăng xuất</button>
    </nav>
    <div class="container py-4">
        <h2>Lịch xem nhà</h2>
        <p>Đặt, xác nhận và hủy lịch xem nhà</p>
        <div class="card p-3 mb-3">
            <b>Đặt lịch xem nhà</b>
            <div class="row g-2 mt-1">
                <div class="col-md-3">
                    <label for="v-nha">Listing</label>
                    <select id="v-nha" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <label for="v-lead">Khách hàng / Lead</label>
                    <select id="v-lead" class="form-select"></select>
                </div>
                <div class="col-md-2">
                    <label for="v-ngay">Ngày xem</label>
                    <input id="v-ngay" type="date" class="form-control">
                </div>
                <div class="col-md-2">
                    <label for="v-gio">Giờ xem</label>
                    <input id="v-gio" type="time" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button id="nut-dat" class="btn btn-xanh w-100">Đặt lịch hẹn</button>
                </div>
            </div>
            <div class="loi" id="loi-lich"></div>
        </div>
        <div id="thong-bao"></div>
        <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
        <div id="state-empty" class="d-none alert alert-warning"></div>
        <div id="state-error" class="d-none alert alert-danger">
            <span id="error-text"></span>
            <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
        </div>
        <div id="list" class="d-none table-responsive">
            <table class="table bg-white">
                <thead>
                    <tr>
                        <th>Khách</th>
                        <th>Nhà</th>
                        <th>Thời gian</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="bang"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/agent-viewing-schedule.js"></script>
</body>
</html>
