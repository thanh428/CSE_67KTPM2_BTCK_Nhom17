<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Của tôi - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/seeker-my-space.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="seeker-property-search.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="index.html">Trang chủ</a>
      <a class="me-3" href="seeker-property-search.html">Tìm nhà</a>
      <a class="me-3" href="seeker-property-compare.html">So sánh</a>
      <a class="me-3" href="seeker-home-brief.html">Brief của tôi</a>
      <a class="me-3 fw-bold border-bottom border-warning border-3" href="seeker-my-space.html">Của tôi</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><a class="dropdown-item" href="seeker-my-space.html">Của tôi</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <a href="seeker-property-search.html">Tìm nhà</a>
      &gt;
      <b>Của tôi</b>
      <ul class="nav nav-tabs mt-3">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-luu">Đã lưu</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-lich">Lịch xem</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bc">Báo cáo của tôi</button>
        </li>
      </ul>
      <div class="tab-content pt-3">
        <div class="tab-pane fade show active" id="tab-luu">
          <div id="thong-bao"></div>
          <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
          <div id="state-empty" class="d-none alert alert-warning"></div>
          <div id="state-error" class="d-none alert alert-danger">
            <span id="error-text"></span>
            <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
          </div>
          <div id="list" class="row g-3 d-none"></div>
        </div>
        <div class="tab-pane fade" id="tab-lich">
          <table class="table bg-white">
            <thead>
              <tr>
                <th>Nhà</th>
                <th>Thời gian</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="bang-lich"></tbody>
          </table>
        </div>
        <div class="tab-pane fade" id="tab-bc">
          <table class="table bg-white">
            <thead>
              <tr>
                <th>Mã</th>
                <th>Nhà</th>
                <th>Lý do</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="bang-bc"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/seeker-my-space.js"></script>
  </body>
</html>
