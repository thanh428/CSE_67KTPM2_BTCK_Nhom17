<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>So sánh nhà - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/seeker-property-compare.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="seeker-property-search.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="index.html">Trang chủ</a>
      <a class="me-3" href="seeker-property-search.html">Tìm nhà</a>
      <a class="me-3 fw-bold border-bottom border-warning border-3" href="seeker-property-compare.html">So sánh</a>
      <a class="me-3" href="seeker-home-brief.html">Brief của tôi</a>
      <a class="me-3" href="seeker-my-space.html">Của tôi</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><a class="dropdown-item" href="seeker-my-space.html">Của tôi</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <h3>So sánh nhà</h3>
      <p>Chọn tối đa 3 nhà từ danh sách đã lưu.</p>
      <div id="thong-bao"></div>
      <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
      <div id="state-empty" class="d-none alert alert-warning"></div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="d-none">
        <div id="chon-nha" class="mb-3"></div>
        <div class="table-responsive">
          <table class="table bg-white">
            <thead id="bang-dau"></thead>
            <tbody id="bang"></tbody>
          </table>
        </div>
        <div class="card p-3 mb-3">
          <b>Trọng số (tổng được quy về 100)</b>
          <div class="row g-2 mt-1" id="trong-so"></div>
        </div>
        <div class="ai-khung">
          <b>AI Comparison Assistant</b>
          <div id="ai-noidung">Chọn nhà rồi bấm Xếp hạng.</div>
          <button id="nut-xephang" class="btn btn-xanh btn-sm mt-2">Xếp hạng</button>
          <span id="giai-thich" class="small"></span>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/seeker-property-compare.js"></script>
  </body>
</html>
