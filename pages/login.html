<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - HomeFit AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <nav class="navbar bg-white border-bottom px-4">
    <a class="logo" href="login.html">HomeFit <span>AI</span></a>
  </nav>
  <div class="row g-0 khung">
    <div class="col-md-6 ben-trai d-none d-md-flex">
      <div>
        <h1>Nhà hợp với cách bạn sống</h1>
        <p>Mô tả nhu cầu bằng lời của bạn<br>Xem điểm hợp và lý do<br>So sánh tối đa 3 nhà cạnh nhau</p>
      </div>
    </div>
    <div class="col-md-6 ben-phai">
      <form id="form-login" class="w-100" style="max-width:420px">
        <h2>Đăng nhập</h2>
        <label class="mt-3 fw-bold" for="email">Email</label>
        <input id="email" class="form-control" placeholder="nhapemail@example.com">
        <label class="mt-3 fw-bold" for="matkhau">Mật khẩu</label>
        <input id="matkhau" type="password" class="form-control" placeholder="Mật khẩu demo: 123456">
        <p class="mt-3 mb-1 fw-bold">Đăng nhập nhanh để demo</p>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-outline-dark btn-sm nhanh" data-email="a.nguyen@email.com">Người tìm nhà</button>
          <button type="button" class="btn btn-outline-dark btn-sm nhanh" data-email="b.tran@email.com">Môi giới</button>
          <button type="button" class="btn btn-outline-dark btn-sm nhanh" data-email="c.le@email.com">Kiểm duyệt</button>
          <button type="button" class="btn btn-outline-dark btn-sm nhanh" data-email="admin@homefit.vn">Quản trị</button>
        </div>
        <button class="btn btn-xanh w-100 mt-3">Đăng nhập</button>
        <div id="loi" class="alert alert-danger mt-3 d-none"></div>
      </form>
    </div>
  </div>
  <script src="../js/login.js"></script>
</body>
</html>
