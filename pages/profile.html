<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <nav class="navbar bg-white border-bottom px-4">
        <a class="logo me-4" id="logo-ve" href="login.html">HomeFit <span>AI</span></a>
        <a class="me-3" id="link-chu" href="login.html">Trang chủ</a>
        <a class="me-3" href="help.html">Trợ giúp</a>
        <a class="me-3" href="profile.html">Hồ sơ</a>
        <a class="me-3" href="notifications.html">Thông báo</a>
        <span class="ms-auto me-3" id="ten-user"></span>
        <button id="nut-dangxuat" class="btn btn-outline-dark btn-sm">Đăng xuất</button>
    </nav>
    <div class="container py-4" style="max-width:640px">
        <h2 id="ten-hs">Hồ sơ cá nhân</h2>
        <p id="vai-tro"></p>
        <div id="thong-bao"></div>
        <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
        <div id="state-empty" class="d-none alert alert-warning"></div>
        <div id="state-error" class="d-none alert alert-danger">
            <span id="error-text"></span>
            <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
        </div>
        <div id="list" class="d-none">
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1">Thông tin cá nhân</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2">Bảo mật</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#t3">Thông báo</button>
                </li>
            </ul>
            <div class="tab-content card p-3 border-top-0">
                <div class="tab-pane fade show active" id="t1">
                    <label class="fw-bold" for="p-ten">Họ tên</label>
                    <input id="p-ten" class="form-control">
                    <div class="loi" id="loi-ten"></div>
                    <label class="fw-bold" for="p-email">Email</label>
                    <input id="p-email" class="form-control" disabled>
                    <label class="fw-bold mt-2" for="p-sdt">Số điện thoại</label>
                    <input id="p-sdt" class="form-control" placeholder="090xxxxxxx">
                    <div class="loi" id="loi-sdt"></div>
                    <button id="nut-luu" class="btn btn-xanh">Lưu thay đổi</button>
                </div>
                <div class="tab-pane fade" id="t2">
                    <label class="fw-bold" for="mk-cu">Mật khẩu hiện tại</label>
                    <input id="mk-cu" type="password" class="form-control">
                    <div class="loi" id="loi-mkcu"></div>
                    <label class="fw-bold" for="mk-moi">Mật khẩu mới</label>
                    <input id="mk-moi" type="password" class="form-control">
                    <div class="loi" id="loi-mkmoi"></div>
                    <button id="nut-doimk" class="btn btn-xanh">Đổi mật khẩu</button>
                </div>
                <div class="tab-pane fade" id="t3">
                    <p>Xem và quản lý thông báo của bạn tại trang <a href="notifications.html">Thông báo</a>.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
