<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết nhà - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/seeker-property-detail.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="seeker-property-search.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="index.html">Trang chủ</a>
      <a class="me-3 fw-bold border-bottom border-warning border-3" href="seeker-property-search.html">Tìm nhà</a>
      <a class="me-3" href="seeker-property-compare.html">So sánh</a>
      <a class="me-3" href="seeker-home-brief.html">Brief của tôi</a>
      <a class="me-3" href="seeker-my-space.html">Của tôi</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><a class="dropdown-item" href="seeker-my-space.html">Của tôi</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <div id="thong-bao"></div>
      <div id="state-loading">Đang tải...</div>
      <div id="state-empty" class="d-none alert alert-warning">Không tìm thấy nhà này.</div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="row g-4 d-none">
        <div class="col-lg-7">
          <div class="card p-3">
            <div id="thu-vien" class="mb-3"></div>
            <h3 id="ten-nha"></h3>
            <p id="thong-tin"></p>
            <div id="dong-hop"></div>
            <div class="mt-3">
              <button id="nut-luu" class="btn btn-outline-success">Lưu</button>
              <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#modal-lich">
                Đặt lịch xem nhà
              </button>
              <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#modal-tin">
                Gửi tin nhắn
              </button>
              <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modal-bc">
                Báo cáo tin
              </button>
              <a class="btn btn-outline-dark" href="seeker-property-search.html">Quay lại tìm nhà</a>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="ai-khung">
            <b>AI Listing Summary</b>
            <div id="ai-noidung"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="modal-lich" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Đặt lịch xem nhà</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="fw-bold mt-2" for="lich-ngay">Ngày xem</label>
            <input id="lich-ngay" type="date" class="form-control" />
            <div class="loi" id="loi-lich-ngay"></div>
            <label class="fw-bold mt-2" for="lich-gio">Giờ xem (08:00 - 20:00)</label>
            <input id="lich-gio" type="time" class="form-control" />
            <div class="loi" id="loi-lich-gio"></div>
            <label class="fw-bold mt-2" for="lich-nhan">Lời nhắn cho môi giới</label>
            <input id="lich-nhan" type="text" class="form-control" />
            <div class="loi" id="loi-lich-nhan"></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-xanh" id="gui-lich">Gửi yêu cầu</button>
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="modal-tin" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Gửi tin nhắn cho môi giới</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="fw-bold mt-2" for="tin-ten">Họ tên</label>
            <input id="tin-ten" type="text" class="form-control" />
            <div class="loi" id="loi-tin-ten"></div>
            <label class="fw-bold mt-2" for="tin-sdt">Số điện thoại</label>
            <input id="tin-sdt" type="text" class="form-control" />
            <div class="loi" id="loi-tin-sdt"></div>
            <label class="fw-bold mt-2" for="tin-nd">Nội dung (ít nhất 10 ký tự)</label>
            <input id="tin-nd" type="text" class="form-control" />
            <div class="loi" id="loi-tin-nd"></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-xanh" id="gui-tin">Gửi tin nhắn</button>
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="modal-bc" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Báo cáo tin</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="fw-bold" for="bc-lydo">Lý do</label>
            <select id="bc-lydo" class="form-select">
              <option value="">Chọn lý do</option>
              <option>Sai thông tin giá</option>
              <option>Ảnh không đúng thực tế</option>
              <option>Nghi trùng lặp</option>
            </select>
            <div class="loi" id="loi-bc-lydo"></div>
            <label class="fw-bold mt-2" for="bc-mota">Mô tả (ít nhất 10 ký tự)</label>
            <input id="bc-mota" type="text" class="form-control" />
            <div class="loi" id="loi-bc-mota"></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-xanh" id="gui-bc">Gửi báo cáo</button>
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/seeker-property-detail.js"></script>
  </body>
</html>
