<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duyệt listing - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/moderator-listing-review.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="moderator-listing-review.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="moderator-listing-review.html">Duyệt listing</a>
      <a class="me-3" href="moderator-report-center.html">Report</a>
      <a class="me-3" href="moderator-data-quality.html">Chất lượng DL</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <h2>Duyệt listing</h2>
      <p>Tin chờ duyệt và tin bị báo cáo, kèm tóm tắt của AI</p>
      <div id="thong-bao"></div>
      <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
      <div id="state-empty" class="d-none alert alert-warning"></div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="row g-3 d-none">
        <div class="col-md-4">
          <div class="card p-3">
            <b>
              Hàng chờ (
              <span id="so-hang">0</span>
              )
            </b>
            <div id="hang-cho" class="mt-2"></div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="card p-3 mb-3">
            <h4 id="ten-nha"></h4>
            <p id="thong-tin"></p>
          </div>
          <div class="ai-khung mb-3">
            <b>AI Listing Summary</b>
            (gợi ý của AI)
            <div id="ai-noidung"></div>
          </div>
          <div class="card p-3">
            <b>Quyết định của kiểm duyệt viên</b>
            <label class="mt-2 fw-bold" for="ghichu">
              Ghi chú quyết định (bắt buộc khi từ chối hoặc yêu cầu bổ sung)
            </label>
            <textarea id="ghichu" class="form-control" rows="2"></textarea>
            <div class="loi" id="loi-ghichu"></div>
            <div class="mt-2">
              <button id="nut-duyet" class="btn btn-xanh">Duyệt</button>
              <button id="nut-tuchoi" class="btn btn-outline-danger">Từ chối</button>
              <button id="nut-bosung" class="btn btn-outline-dark">Yêu cầu bổ sung</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/moderator-listing-review.js"></script>
  </body>
</html>
