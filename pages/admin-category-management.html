<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh mục - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/admin-category-management.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="admin-platform-dashboard.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="admin-category-management.html">Danh mục</a>
      <a class="me-3" href="admin-user-management.html">Người dùng</a>
      <a class="me-3" href="admin-platform-dashboard.html">Dashboard</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <h2>Danh mục</h2>
      <p>Loại nhà và nhãn nhu cầu dùng cho bộ lọc và AI</p>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" id="tab-loai">Loại BĐS</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-nhan">Nhãn nhu cầu</button></li>
      </ul>
      <div class="d-flex gap-2 mb-3">
        <input id="o-tim" class="form-control" placeholder="Tìm..." />
        <button id="nut-them" class="btn btn-xanh text-nowrap">Thêm mới</button>
      </div>
      <div id="thong-bao"></div>
      <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
      <div id="state-empty" class="d-none alert alert-warning"></div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="d-none table-responsive">
        <table class="table bg-white">
          <thead id="bang-dau"></thead>
          <tbody id="bang"></tbody>
        </table>
      </div>
    </div>
    <div class="modal fade" id="modal-dm" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="m-tieude">Thêm mới</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="fw-bold" for="m-ten">Tên</label>
            <input id="m-ten" class="form-control" />
            <div id="khu-nhan">
              <label class="fw-bold mt-2" for="m-tukhoa">Từ khóa AI nhận ra (cách nhau bằng dấu phẩy)</label>
              <input id="m-tukhoa" class="form-control" />
              <label class="fw-bold mt-2" for="m-quytac">Quy tắc</label>
              <select id="m-quytac" class="form-select">
                <option value="gan-truong">Cách trường nhỏ hơn hoặc bằng 500m</option>
                <option value="yen-tinh">Mức yên tĩnh Cao hoặc Rất cao</option>
                <option value="lam-viec">Có chỗ làm việc</option>
                <option value="gia-dinh">Từ 2 phòng ngủ và yên tĩnh Cao trở lên</option>
              </select>
            </div>
            <div class="loi" id="loi-modal"></div>
          </div>
          <div class="modal-footer">
            <button id="nut-luu" class="btn btn-xanh">Lưu</button>
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/admin-category-management.js"></script>
  </body>
</html>
