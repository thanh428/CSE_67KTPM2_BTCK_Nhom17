<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý listing - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/agent-listing-management.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom px-4">
      <a class="logo me-4" href="agent-dashboard.html">
        HomeFit
        <span>AI</span>
      </a>
      <a class="me-3" href="agent-dashboard.html">Tổng quan</a>
      <a class="me-3" href="agent-listing-management.html">Listing</a>
      <a class="me-3" href="agent-listing-upload.html">Đăng tin</a>
      <a class="me-3" href="agent-viewing-schedule.html">Lịch hẹn</a>
      <a class="me-3" href="agent-lead-management.html">Lead</a>
      <a class="ms-auto me-3" href="help.html">Trợ giúp</a>
      <a class="me-3" href="notifications.html">
        Thông báo
        <span class="badge bg-warning text-dark" id="so-thongbao"></span>
      </a>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <span id="ten-user"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">Hồ sơ</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button id="nut-dangxuat" class="dropdown-item text-danger" type="button">Đăng xuất</button></li>
        </ul>
      </div>
    </nav>
    <div class="container py-4">
      <h2>Quản lý listing</h2>
      <p>Tất cả tin bạn đã đăng và trạng thái duyệt</p>
      <div class="d-flex gap-2 mb-3">
        <input id="o-tim" class="form-control" placeholder="Tìm theo tên listing..." />
        <select id="loc-tt" class="form-select w-auto">
          <option value="">Tất cả</option>
          <option>Nháp</option>
          <option>Chờ duyệt</option>
          <option>Đã duyệt</option>
          <option>Cần bổ sung</option>
          <option>Từ chối</option>
          <option>Lưu trữ</option>
        </select>
      </div>
      <div id="thong-bao"></div>
      <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
      <div id="state-empty" class="d-none alert alert-warning"></div>
      <div id="state-error" class="d-none alert alert-danger">
        <span id="error-text"></span>
        <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
      </div>
      <div id="list" class="d-none table-responsive">
        <table class="table bg-white">
          <thead>
            <tr>
              <th>Mã</th>
              <th>Tên listing</th>
              <th>Quận</th>
              <th>Giá</th>
              <th>m²</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="bang"></tbody>
        </table>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/agent-listing-management.js"></script>
  </body>
</html>
