<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo - HomeFit AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/notifications.css">
</head>
<body>
    <nav class="navbar bg-white border-bottom px-4">
        <a class="logo me-4" id="logo-ve" href="login.html">HomeFit <span>AI</span></a>
        <a class="me-3" id="link-chu" href="login.html">Trang chủ</a>
        <a class="me-3" href="help.html">Trợ giúp</a>
        <a class="me-3" href="profile.html">Hồ sơ</a>
        <a class="me-3" href="notifications.html">Thông báo</a>
        <span class="ms-auto me-3" id="ten-user"></span>
        <button id="nut-dangxuat" class="btn btn-outline-dark btn-sm">Đăng xuất</button>
    </nav>
    <div class="container py-4" style="max-width:760px">
        <h2>Thông báo</h2>
        <div class="d-flex gap-2 mb-3">
            <select id="loc" class="form-select w-auto">
                <option value="all">Tất cả</option>
                <option value="unread">Chưa đọc</option>
                <option value="read">Đã đọc</option>
            </select>
            <button id="nut-doc-het" class="btn btn-outline-dark">Đánh dấu tất cả đã đọc</button>
        </div>
        <div id="thong-bao"></div>
        <div id="state-loading" class="d-none">Đang tải dữ liệu...</div>
        <div id="state-empty" class="d-none alert alert-warning"></div>
        <div id="state-error" class="d-none alert alert-danger">
            <span id="error-text"></span>
            <button id="nut-thulai" class="btn btn-sm btn-outline-danger ms-2">Thử lại</button>
        </div>
        <div id="list" class="d-none"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/notifications.js"></script>
</body>
</html>
